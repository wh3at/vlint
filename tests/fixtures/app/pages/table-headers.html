<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: sans-serif; margin: 24px; }
      table { border-collapse: collapse; table-layout: fixed; width: 640px; }
      th { padding: 4px; text-align: left; font-size: 16px; line-height: 20px; }
      @media (max-width: 500px) {
        table { width: 280px; }
        #responsive-header { width: 74px; }
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th id="responsive-header" scope="col">Review score</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
    </table>
  </body>
</html>
