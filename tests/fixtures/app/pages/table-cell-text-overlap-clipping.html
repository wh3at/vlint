<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body { margin: 0; font: 16px Arial; }
table { table-layout: fixed; border-spacing: 4px; width: 360px; }
col:first-child { width: 120px; }
th, td { padding: 0; height: 40px; vertical-align: top; }
</style></head><body><table><colgroup><col><col></colgroup><tbody>
<tr><td id="scaled-down"><span style="display:block;width:240px;overflow:hidden;transform:scale(0.5);transform-origin:top left;white-space:nowrap">VeryLongUnbrokenPropertyIdentifier</span></td><td id="scaled-down-neighbor">1</td></tr>
<tr><td id="polygon-hidden"><span style="display:block;width:135px;clip-path:polygon(0 0,0 0,0 0);white-space:nowrap">VeryLongUnbrokenPropertyIdentifier</span></td><td id="polygon-hidden-neighbor">2</td></tr>
<tr><td id="polygon-away"><span style="display:block;width:135px;height:40px;clip-path:polygon(0 0,100% 0,0 100%)"><span style="position:relative;left:110px;top:26px;white-space:nowrap">VeryLongUnbrokenPropertyIdentifier</span></span></td><td id="polygon-away-neighbor">3</td></tr>
<tr><td id="circle-zero"><span style="display:block;width:135px;clip-path:circle(0);white-space:nowrap">VeryLongUnbrokenPropertyIdentifier</span></td><td id="circle-zero-neighbor">4</td></tr>
<tr><td id="ellipse-hidden"><span style="display:block;width:135px;height:40px;clip-path:ellipse(40px 8px at 50% 50%)"><span style="position:relative;left:110px;top:30px;white-space:nowrap">VeryLongUnbrokenPropertyIdentifier</span></span></td><td id="ellipse-hidden-neighbor">5</td></tr>
<tr><td id="rounded-edge"><span style="display:block;width:135px;height:40px;clip-path:inset(0 round 8px)"><span style="position:relative;left:110px;white-space:nowrap">VeryLongUnbrokenPropertyIdentifier</span></span></td><td id="rounded-edge-neighbor">6</td></tr>
<tr><td id="scaled-up"><span style="display:block;width:120px;overflow:hidden;transform:scale(2);transform-origin:top left;white-space:nowrap">VeryLongUnbrokenPropertyIdentifier</span></td><td id="scaled-up-neighbor">7</td></tr>
</tbody></table></body></html>
