<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body { margin: 0; font: 16px Arial; }
table { table-layout: fixed; border-spacing: 4px; width: 360px; }
col:first-child { width: 120px; }
th, td { padding: 0; height: 80px; vertical-align: top; }
</style></head><body>
<table><colgroup><col><col></colgroup><tbody>
<tr><td id="asymmetric-corner"><span style="display:block;width:240px;height:80px;overflow:hidden;border-top-right-radius:40px"><span id="asymmetric-corner-text" style="position:relative;left:236px;font-size:10px;white-space:nowrap">X</span></span></td><td id="asymmetric-corner-neighbor">1</td></tr>
<tr><td id="asymmetric-edge"><span style="display:block;width:240px;height:80px;overflow:hidden;border-top-right-radius:40px"><span id="asymmetric-edge-text" style="position:relative;left:236px;top:68px;font-size:10px;white-space:nowrap">X</span></span></td><td id="asymmetric-edge-neighbor">2</td></tr>
<tr><td id="ellipse-flat"><span style="display:block;width:240px;height:80px;overflow:hidden;border-radius:4px / 40px"><span id="ellipse-flat-text" style="position:relative;left:234px;font-size:10px;white-space:nowrap">X</span></span></td><td id="ellipse-flat-neighbor">3</td></tr>

<tr><td id="clip-axis-next" style="height:40px">5</td><td id="clip-axis-next-neighbor" style="height:40px">6</td></tr>
</tbody></table></body></html>
