# vlint continuous integration (unit U6).
#
# Secret-free, least-privilege quality and browser-acceptance pipeline for
# pull requests and pushes to the default branch. Every job holds
# contents:read only; no job uses a release environment or a write token.
# Third-party actions are pinned to immutable commit SHAs, never mutable tags.
#
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Cancel superseded runs on the same ref; never block a newer push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs inherit this and never widen.
permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  # ---------------------------------------------------------------------------
  # Secret-free quality gates (no browser execution).
  # ---------------------------------------------------------------------------

  typecheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Verify PR title encodes release intent
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun run scripts/check-release-intent.ts

  architecture:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check:architecture
      - name: Verify container image digest pins
        run: bun run check:container-images

  unit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  # ---------------------------------------------------------------------------
  # Production compile — gates all downstream jobs on a binary built from
  # typechecked, architecture-clean source.
  # ---------------------------------------------------------------------------

  build:
    needs: [typecheck, architecture, unit]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Compile production binary
        run: bun run build:linux-x64
      - name: Verify compiled CLI contract
        run: bun test tests/smoke/compiled-cli-contract.test.ts
      - name: Upload production binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vlint-linux-x64
          path: dist/vlint-linux-x64
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Browser integration and acceptance gate.
  #
  # One job installs the pinned browser once, then runs both source-level
  # integration tests and compiled-binary acceptance tests against that exact
  # managed cache. No browser cache crosses a job or trust boundary.
  # ---------------------------------------------------------------------------

  browser-integration:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Download production binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vlint-linux-x64
          path: dist
      - name: Restore executable mode
        run: chmod +x dist/vlint-linux-x64
      - name: Install and verify pinned browser
        run: ./dist/vlint-linux-x64 browser install
      - name: Run integration tests
        run: bun run test:integration
      - name: Run compiled CLI acceptance tests
        run: bun run test:acceptance

  three-engine-acceptance:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vlint-linux-x64
          path: dist
      - run: chmod +x dist/vlint-linux-x64
      - run: bun run test:acceptance:three-engine
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: three-engine-acceptance
          path: dist/acceptance/
          if-no-files-found: error
          retention-days: 7

  browser-privilege:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vlint-linux-x64
          path: dist
      - run: chmod +x dist/vlint-linux-x64
      - run: bun run test:acceptance:privilege
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-privilege
          path: dist/acceptance/
          if-no-files-found: error
          retention-days: 7

  browser-tests:
    needs: [browser-integration, three-engine-acceptance, browser-privilege]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every browser gate to succeed
        env:
          INTEGRATION: ${{ needs.browser-integration.result }}
          THREE_ENGINE: ${{ needs.three-engine-acceptance.result }}
          PRIVILEGE: ${{ needs.browser-privilege.result }}
        run: |
          test "$INTEGRATION" = success
          test "$THREE_ENGINE" = success
          test "$PRIVILEGE" = success

  # ---------------------------------------------------------------------------
  # Standalone release validation (Docker-based clean Ubuntu 24.04 guest).
  # Self-contained: builds, stages the archive + SHA256SUMS, and runs the full
  # release validator inside a disposable guest. Gated on build so a broken
  # compile does not waste Docker resources.
  # ---------------------------------------------------------------------------

  release-validate:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Validate release in clean Ubuntu 24.04 guest
        run: bun run release:validate
