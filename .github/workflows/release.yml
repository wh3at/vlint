
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Release Please tag to recover
        required: true
        type: string

# One release pipeline per tag; never cancel an in-flight release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Provenance gate (read-only).
  #    The tag commit must live on the protected default branch, every required
  #    status check must have succeeded at that exact SHA, and the version
  #    embedded in package.json must equal the tag's semver. Nothing is built
  #    or signed until provenance clears.
  # ---------------------------------------------------------------------------
  provenance:
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
      statuses: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.checked.outputs.sha }}
      semver: ${{ steps.meta.outputs.semver }}
      archive: ${{ steps.meta.outputs.archive }}
      deb: ${{ steps.meta.outputs.deb }}
      installer: ${{ steps.meta.outputs.installer }}
    steps:
      - name: Require default branch for recovery
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::recovery dispatch must run from refs/heads/$DEFAULT_BRANCH (got $GITHUB_REF)"
            exit 1
          fi

      - name: Resolve tag metadata
        id: meta
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ref '$TAG' is not a version tag (expected v<semver>)"
            exit 1
          fi
          SEMVER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "archive=vlint-${TAG}-linux-x64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "deb=vlint_${SEMVER}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "installer=install-${TAG}.sh" >> "$GITHUB_OUTPUT"

      - name: Checkout tag commit (full history for ancestry check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Verify default-branch provenance, required checks, and version
        id: checked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          SEMVER: ${{ steps.meta.outputs.semver }}
        run: |
          set -euo pipefail
          CHECKED_SHA="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            SHA="$GITHUB_SHA"
            if [ "$CHECKED_SHA" != "$SHA" ]; then
              echo "::error::checkout $CHECKED_SHA != event commit $SHA"
              exit 1
            fi
          else
            SHA="$CHECKED_SHA"
          fi

          # (a) Embedded version must match the tag.
          PKG_VERSION="$(jq -r '.version' package.json)"
          if [ "$PKG_VERSION" != "$SEMVER" ]; then
            echo "::error::package.json version '$PKG_VERSION' != tag semver '$SEMVER'"
            exit 1
          fi

          # (b) The tag commit must be reachable from the protected default branch.
          if ! git merge-base --is-ancestor "$SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::tag commit $SHA is not on the $DEFAULT_BRANCH history"
            exit 1
          fi

          # (c) GitHub's workflow token cannot read branch-protection settings,
          #     even though it can read checks. Keep this release gate aligned
          #     with the required contexts configured on `main`.
          REQUIRED='typecheck
          architecture
          unit
          build
          browser-tests
          release-validate'

          # (d) Every required context must have reported success at this SHA.
          PASSED_RUNS="$(gh api "/repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate 2>/dev/null \
            | jq -r '.check_runs[]? | select(.conclusion=="success") | .name' 2>/dev/null || true)"
          PASSED_STATUSES="$(gh api "/repos/$REPO/commits/$SHA/status?per_page=100" 2>/dev/null \
            | jq -r '.statuses[]? | select(.state=="success") | .context' 2>/dev/null || true)"
          ALL_PASSED="$(printf '%s\n%s\n' "$PASSED_RUNS" "$PASSED_STATUSES" | sed '/^$/d' | sort -u)"

          missing=0
          while IFS= read -r ctx; do
            [ -n "$ctx" ] || continue
            if ! printf '%s\n' "$ALL_PASSED" | grep -Fqx -- "$ctx"; then
              echo "::error::required check '$ctx' did not report success at $SHA"
              missing=1
            fi
          done <<EOF
          $REQUIRED
          EOF
          if [ "$missing" -ne 0 ]; then exit 1; fi

          echo "Provenance gate passed for $TAG @ $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Build (secret-free, contents:read).
  #    Reproducibly compiles the Linux x64 baseline binary, packages the tarball,
  #    Ubuntu .deb, tag-fixed installer, and SHA256SUMS, then uploads one immutable
  #    Actions artifact. The manifest digest is threaded through every boundary.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: provenance
    outputs:
      manifest_sha256: ${{ steps.digest.outputs.manifest_sha256 }}
    steps:
      - name: Checkout tag commit (frozen build inputs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.provenance.outputs.sha }}

      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build production CLI and release fixture
        run: |
          set -euo pipefail
          # Production single executable (embeds Playwright library code).
          bun run build:linux-x64
          # Single-line tab fixture for the production happy-path check.
          # Compiled directly (not via scripts/build.ts) so the build target map
          # stays unchanged; this binary is test-only and not shipped.
          bun build tests/release/release-fixture-server.ts \
            --compile --target bun-linux-x64-baseline \
            --outfile dist/vlint-release-fixture-server

      - name: Package release assets
        run: |
          set -euo pipefail
          bun run package:release -- --output dist/release
          cat dist/release/SHA256SUMS

      - name: Record immutable manifest digest
        id: digest
        run: |
          set -euo pipefail
          sha="$(sha256sum dist/release/SHA256SUMS | awk '{print $1}')"
          echo "manifest_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Immutable manifest digest: $sha"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vlint-release-${{ needs.provenance.outputs.tag }}
          path: |
            dist/release/
            dist/vlint-release-fixture-server
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Validate (credential-free clean Ubuntu 24.04 guest).
  #    Re-derives the manifest digest and every listed asset digest, then runs
  #    archive, installer, and .deb checks in a clean Ubuntu 24.04 guest.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [provenance, build]
    steps:
      - name: Checkout validator scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.provenance.outputs.sha }}

      - name: Download immutable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vlint-release-${{ needs.provenance.outputs.tag }}
          path: release-artifacts

      - name: Verify immutable manifest handoff
        env:
          EXPECTED: ${{ needs.build.outputs.manifest_sha256 }}
          MANIFEST: release-artifacts/release/SHA256SUMS
        run: |
          set -euo pipefail
          actual="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::manifest mismatch after download: expected $EXPECTED got $actual"
            exit 1
          fi
          ( cd "$(dirname "$MANIFEST")" && sha256sum -c SHA256SUMS )
          echo "Immutable manifest confirmed: $actual"

      - name: Validate release in clean Ubuntu 24.04 guest
        env:
          ARCHIVE: release-artifacts/release/${{ needs.provenance.outputs.archive }}
          DEB: release-artifacts/release/${{ needs.provenance.outputs.deb }}
          INSTALLER: release-artifacts/release/${{ needs.provenance.outputs.installer }}
          CHECKSUM: release-artifacts/release/SHA256SUMS
          FIXTURE: release-artifacts/vlint-release-fixture-server
        run: |
          # actions/download-artifact does not preserve executable mode.
          chmod 0755 "$FIXTURE" "$INSTALLER"
          sh tests/release/validate.sh release \
            "$ARCHIVE" "$CHECKSUM" "$FIXTURE" "$DEB" "$INSTALLER"

  publish:
    runs-on: ubuntu-24.04
    needs: [provenance, build, validate]
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vlint-release-${{ needs.provenance.outputs.tag }}
          path: release-artifacts

      - name: Re-verify manifest before publication
        env:
          EXPECTED: ${{ needs.build.outputs.manifest_sha256 }}
          MANIFEST: release-artifacts/release/SHA256SUMS
        run: |
          set -euo pipefail
          actual="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::publish manifest mismatch: expected $EXPECTED got $actual"
            exit 1
          fi
          ( cd "$(dirname "$MANIFEST")" && sha256sum -c SHA256SUMS )

      - name: Verify tag and App-authored draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.provenance.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.provenance.outputs.sha }}
        run: |
          set -euo pipefail
          obj="$(gh api "/repos/$REPO/git/ref/tags/$TAG" --jq '.object')"
          tag_sha="$(printf '%s' "$obj" | jq -r '.sha')"
          if [ "$(printf '%s' "$obj" | jq -r '.type')" = tag ]; then
            tag_sha="$(gh api "/repos/$REPO/git/tags/$tag_sha" --jq '.object.sha')"
          fi
          if [ "$tag_sha" != "$SHA" ]; then
            echo "::error::tag points at $tag_sha, expected $SHA"
            exit 1
          fi
          release="$(gh release view "$TAG" --repo "$REPO" --json author,name,targetCommitish,body,assets,isDraft,tagName)"
          if ! printf '%s' "$release" | jq -e --arg tag "$TAG" --arg sha "$SHA" \
            '.tagName == $tag and .name == $tag and .targetCommitish == $sha and .isDraft == true and .author.login == "vlint-release-please[bot]" and (.body | length > 0) and (.assets | length == 0)' >/dev/null; then
            echo "::error::release $TAG is not an App-authored draft at $SHA with notes and no assets"
            exit 1
          fi

      - name: Upload assets to the verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.provenance.outputs.tag }}
          REPO: ${{ github.repository }}
          ASSET_DIR: release-artifacts/release
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$REPO" "$ASSET_DIR"/*

      - name: Verify server-side asset bytes, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.provenance.outputs.tag }}
          REPO: ${{ github.repository }}
          EXPECTED: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --pattern "*" --dir verify-assets
          actual="$(sha256sum verify-assets/SHA256SUMS | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::server-side manifest digest $actual != expected $EXPECTED"
            exit 1
          fi
          ( cd verify-assets && sha256sum -c SHA256SUMS )
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "Published $TAG"

  # ---------------------------------------------------------------------------
  # 5. Anonymous re-download verification (permissions-empty, no token).
  #    Proves a public, credential-free consumer can fetch the published asset
  #    by URL alone and reproduce the exact checksum.
  # ---------------------------------------------------------------------------
  verify-public:
    runs-on: ubuntu-24.04
    permissions: {}
    needs: [provenance, build, publish]
    steps:
      - name: Anonymous download and checksum match
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.provenance.outputs.tag }}
          ARCHIVE: ${{ needs.provenance.outputs.archive }}
          DEB: ${{ needs.provenance.outputs.deb }}
          INSTALLER: ${{ needs.provenance.outputs.installer }}
          EXPECTED: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/$TAG"
          mkdir public-assets
          # No Authorization header, no GITHUB_TOKEN: pure anonymous public fetch.
          for asset in "$ARCHIVE" "$DEB" "$INSTALLER" SHA256SUMS; do
            curl -fsSL "$base/$asset" -o "public-assets/$asset"
          done
          actual="$(sha256sum public-assets/SHA256SUMS | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::public manifest digest $actual != expected $EXPECTED"
            exit 1
          fi
          ( cd public-assets && sha256sum -c SHA256SUMS )
          echo "Anonymous asset set verified: $actual"

  cleanup-on-failure:
    runs-on: ubuntu-24.04
    needs: [provenance, build, validate, publish, verify-public]
    if: failure() && needs.provenance.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.publish.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Remove incomplete Release Please release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.provenance.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.provenance.outputs.sha }}
        run: |
          set -euo pipefail
          if ! release="$(gh release view "$TAG" --repo "$REPO" --json author,tagName,targetCommitish 2>/dev/null)"; then
            exit 0
          fi
          if ! printf '%s' "$release" | jq -e --arg tag "$TAG" --arg sha "$SHA" \
            '.tagName == $tag and .targetCommitish == $sha and .author.login == "vlint-release-please[bot]"' >/dev/null; then
            exit 0
          fi
          obj="$(gh api "/repos/$REPO/git/ref/tags/$TAG" --jq '.object')"
          tag_sha="$(printf '%s' "$obj" | jq -r '.sha')"
          if [ "$(printf '%s' "$obj" | jq -r '.type')" = tag ]; then
            tag_sha="$(gh api "/repos/$REPO/git/tags/$tag_sha" --jq '.object.sha')"
          fi
          if [ "$tag_sha" != "$SHA" ]; then
            exit 0
          fi
          gh release delete "$TAG" --repo "$REPO" --yes
          echo "Removed incomplete release $TAG; keep the tag for manual recovery"
